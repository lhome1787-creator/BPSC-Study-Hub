/* QUESTIONS PAGE PAR SHOW KARNA */
const test = document.getElementById("mockTest");

questions.forEach((item,index)=>{

    const qNumber = index + 1;

    const div = document.createElement("div");
    div.className = "question";

    div.innerHTML = `
        <h3>${qNumber}. ${item.q}</h3>

        <label class="option">
            <input type="radio" name="q${qNumber}" value="A">
            A. ${item.o[0]}
        </label>

        <label class="option">
            <input type="radio" name="q${qNumber}" value="B">
            B. ${item.o[1]}
        </label>

        <label class="option">
            <input type="radio" name="q${qNumber}" value="C">
            C. ${item.o[2]}
        </label>

        <label class="option">
            <input type="radio" name="q${qNumber}" value="D">
            D. ${item.o[3]}
        </label>

        <label class="option">
            <input type="radio" name="q${qNumber}" value="E">
            E. Not Attempted
        </label>
    `;

    test.appendChild(div);
});


/* SCORE CALCULATE */
function calculateScore(){

    let score = 0;
    let correct = 0;
    let wrong = 0;
    let notAttempted = 0;

    questions.forEach((item,index)=>{

        const qNumber = index + 1;

        const selected = document.querySelector(
            `input[name="q${qNumber}"]:checked`
        );

        if(!selected || selected.value === "E"){

            notAttempted++;

        }
        else if(selected.value === item.a){

            score += 1;
            correct++;

        }
        else{

            score -= 1/3;
            wrong++;

        }

    });

    document.getElementById("result").innerHTML = `
        <h2>🎯 Test Result</h2>

        <h3>प्राप्त Score: ${score.toFixed(2)} / 100</h3>

        <p>✅ सही उत्तर: ${correct}</p>

        <p>❌ गलत उत्तर: ${wrong}</p>

        <p>⭕ Not Attempted: ${notAttempted}</p>
    `;

    window.scrollTo({
        top:document.getElementById("result").offsetTop,
        behavior:"smooth"
    });
}

</script>
