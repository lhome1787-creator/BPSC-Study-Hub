// Safety: exactly 100 questions only.
const questions100=questions.slice(0,100);
    // Question Palette
const palette = document.getElementById("questionPalette");

questions100.forEach((item, i) => {
    const btn = document.createElement("button");
    btn.textContent = i + 1;
    btn.className = "palette-btn";

  btn.type = "button";

btn.onclick = (event) => {
    event.preventDefault();

    const question = document.getElementById("question-" + i);

    if (question) {
        question.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });
    }
};

    palette.appendChild(btn);
});
let timeLeft=7200, submitted=false;
function renderQuestions() {
    const box = document.getElementById("mockTest");
    box.innerHTML = "";

    questions100.forEach((item, i) => {
        const n = i + 1;

        let html = `
            <div class="question" id="question-${i}">
                <h3>${n}. ${item[0]}</h3>
        `;

        item[1].forEach((option, j) => {
            const letter = String.fromCharCode(65 + j);

            html += `
                <label>
                    <input type="radio" name="q${n}" value="${letter}">
                    ${letter}. ${option}
                </label>
            `;
        });

        html += `
            <label>
                <input type="radio" name="q${n}" value="E">
                E. Not Attempted
            </label>
            </div>
        `;

        box.innerHTML += html;
    });
}



function calculateScore() {
    let score = 0;
    let correct = 0;
    let wrong = 0;
    let skip = 0;
    let review = "";

    questions100.forEach((item, i) => {
        const n = i + 1;

        const selected = document.querySelector(
            `input[name="q${n}"]:checked`
        );

        const correctAnswer = item[2];

        if (!selected || selected.value === "E") {
            skip++;

            review += `
                <div class="review-item">
                    <h4>Q${n}. ${item[0]}</h4>
                    <p>⭕ <b>Not Attempted</b></p>
                    <p>✅ सही उत्तर: <b>${correctAnswer}</b></p>
                </div>
            `;
        } 
        else if (selected.value === correctAnswer) {
            score += 1;
            correct++;

            review += `
                <div class="review-item">
                    <h4>Q${n}. ${item[0]}</h4>
                    <p>🟢 आपका उत्तर: <b>${selected.value}</b> — सही</p>
                    <p>✅ सही उत्तर: <b>${correctAnswer}</b></p>
                </div>
            `;
        } 
        else {
            score -= 1 / 3;
            wrong++;

            review += `
                <div class="review-item">
                    <h4>Q${n}. ${item[0]}</h4>
                    <p>🔴 आपका उत्तर: <b>${selected.value}</b> — गलत</p>
                    <p>✅ सही उत्तर: <b>${correctAnswer}</b></p>
                </div>
            `;
        }
    });

    document.getElementById("result").innerHTML = `
        <div class="result-box">
            <h2>🎯 Test Result</h2>

            <h3>प्राप्त Score: ${score.toFixed(2)} / 100</h3>

            <p>🟢 सही उत्तर: ${correct}</p>
            <p>🔴 गलत उत्तर: ${wrong}</p>
            <p>⭕ Not Attempted: ${skip}</p>

            <hr>

            <h2>📖 Answer Review</h2>

            <div class="answer-review">
                ${review}
            </div>

            <br>

            <button onclick="location.reload()">
                🔄 Retry Mock Test
            </button>
        </div>
    `;

    submitted = true;

    window.scrollTo({
        top: document.getElementById("result").offsetTop,
        behavior: "smooth"
    });
}

document.getElementById("submitBtn").onclick = calculateScore;

setInterval(() => {
    if (submitted) return;

    if (timeLeft <= 0) {
        calculateScore();
        return;
    }

    timeLeft--;

    const hours = Math.floor(timeLeft / 3600);
    const minutes = Math.floor((timeLeft % 3600) / 60);
    const seconds = timeLeft % 60;

    document.getElementById("timer").innerHTML =
        "समय बाकी: " +
        String(hours).padStart(2, "0") + ":" +
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0");
}, 1000);


renderQuestions();
</script></body></html>
