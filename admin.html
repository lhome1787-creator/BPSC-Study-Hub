<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BPSC Study Hub - Admin Panel</title>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f1f5f9;
    color:#1e293b;
}

/* LOGIN */
.login-page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:linear-gradient(135deg,#0d47a1,#1976d2);
}

.login-box{
    width:100%;
    max-width:400px;
    background:white;
    padding:30px;
    border-radius:18px;
    box-shadow:0 10px 35px rgba(0,0,0,.2);
    text-align:center;
}

.logo{
    font-size:45px;
    margin-bottom:10px;
}

.login-box h1{
    color:#0d47a1;
    margin-bottom:8px;
}

.login-box p{
    color:#64748b;
    margin-bottom:25px;
}

.input-group{
    text-align:left;
    margin-bottom:18px;
}

.input-group label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
}

.input-group input{
    width:100%;
    padding:13px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    font-size:16px;
}

.login-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#0d47a1;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.login-btn:hover{
    background:#083578;
}

.login-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    margin-top:15px;
    font-size:14px;
    color:#dc2626;
}

/* DASHBOARD */
.dashboard{
    display:none;
    min-height:100vh;
}

.header{
    background:#0d47a1;
    color:white;
    padding:16px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h2{
    font-size:20px;
}

.logout-btn{
    background:white;
    color:#0d47a1;
    border:0;
    padding:9px 14px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:25px 18px;
}

.welcome{
    margin-bottom:25px;
}

.welcome h1{
    color:#0d47a1;
    margin-bottom:5px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.card{
    background:white;
    padding:22px;
    border-radius:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.card-icon{
    font-size:32px;
    margin-bottom:10px;
}

.card h3{
    margin-bottom:8px;
}

.card p{
    color:#64748b;
}

.menu{
    margin-top:28px;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.menu-item{
    background:white;
    padding:18px;
    border-radius:12px;
    box-shadow:0 3px 10px rgba(0,0,0,.07);
    cursor:pointer;
    font-weight:bold;
}

.menu-item:hover{
    background:#eaf2ff;
}

@media(max-width:700px){

    .cards{
        grid-template-columns:1fr;
    }

    .menu{
        grid-template-columns:1fr;
    }

    .header h2{
        font-size:16px;
    }

    .container{
        padding:20px 14px;
    }
}
</style>
</head>

<body>

<!-- LOGIN PAGE -->
<div class="login-page" id="loginPage">

    <div class="login-box">

        <div class="logo">🎓</div>

        <h1>BPSC Study Hub</h1>

        <p>Secure Admin Panel</p>

        <div class="input-group">
            <label>📧 Admin Email</label>

            <input
                type="email"
                id="adminEmail"
                placeholder="Admin Email"
            >
        </div>

        <div class="input-group">

            <label>🔐 Password</label>

            <input
                type="password"
                id="adminPassword"
                placeholder="Password"
            >

        </div>

        <button
            class="login-btn"
            id="loginButton"
            onclick="login()"
        >
            LOGIN
        </button>

        <div class="message" id="loginMessage"></div>

    </div>

</div>


<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">

    <div class="header">

        <h2>🎓 BPSC Study Hub Admin</h2>

        <button
            class="logout-btn"
            onclick="logout()"
        >
            Logout
        </button>

    </div>


    <div class="container">

        <div class="welcome">

            <h1>📊 Admin Dashboard</h1>

            <p>
                Welcome to BPSC Study Hub Control Panel
            </p>

        </div>


        <div class="cards">

            <div class="card">

                <div class="card-icon">📩</div>

                <h3>New Doubts</h3>

                <p>0 Doubts</p>

            </div>


            <div class="card">

                <div class="card-icon">💬</div>

                <h3>Feedback</h3>

                <p>0 Feedback</p>

            </div>


            <div class="card">

                <div class="card-icon">👥</div>

                <h3>Students</h3>

                <p>0 Students</p>

            </div>

        </div>


        <div class="menu">

            <div class="menu-item">
                📩 Feedback / Doubt
            </div>

            <div class="menu-item">
                📰 Current Affairs
            </div>

            <div class="menu-item">
                ❓ Quiz Questions
            </div>

            <div class="menu-item">
                📚 Notes / PDF
            </div>

            <div class="menu-item">
                👥 Students
            </div>

            <div class="menu-item">
                ⚙️ Settings
            </div>

        </div>

    </div>

</div>


<script>

/* ==============================
   SUPABASE CONFIGURATION
================================ */

const SUPABASE_URL =
    "https://jemapsoiycfivmaifbcn.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_DQPK3mLyY9m1qNcEMgcY-Q_bDyiNt0A";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* ==============================
   LOGIN
================================ */

async function login(){

    const email =
        document.getElementById("adminEmail").value.trim();

    const password =
        document.getElementById("adminPassword").value;

    const message =
        document.getElementById("loginMessage");

    const button =
        document.getElementById("loginButton");


    if(email === "" || password === ""){

        message.textContent =
            "कृपया Email और Password भरें।";

        return;
    }


    button.disabled = true;

    button.textContent = "LOGIN हो रहा है...";

    message.textContent = "";


    try{

        const { data, error } =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });


        if(error){

            message.textContent =
                "❌ Email या Password गलत है।";

            console.log(error);

            return;
        }


        if(data.session){

            showDashboard();

        }

    }catch(error){

        console.log(error);

        message.textContent =
            "❌ Login में समस्या हुई।";

    }finally{

        button.disabled = false;

        button.textContent = "LOGIN";

    }

}


/* ==============================
   SHOW DASHBOARD
================================ */

function showDashboard(){

    document.getElementById("loginPage")
        .style.display = "none";

    document.getElementById("dashboard")
        .style.display = "block";

}


/* ==============================
   LOGOUT
================================ */

async function logout(){

    await supabaseClient.auth.signOut();

    document.getElementById("dashboard")
        .style.display = "none";

    document.getElementById("loginPage")
        .style.display = "flex";

    document.getElementById("adminEmail")
        .value = "";

    document.getElementById("adminPassword")
        .value = "";

}


/* ==============================
   CHECK EXISTING SESSION
================================ */

async function checkSession(){

    const { data } =
        await supabaseClient.auth.getSession();


    if(data.session){

        showDashboard();

    }

}


/* ==============================
   AUTH STATE LISTENER
================================ */

supabaseClient.auth.onAuthStateChange(
    (event, session) => {

        if(session){

            showDashboard();

        }

    }
);


/* START */

checkSession();

</script>

</body>
</html>
